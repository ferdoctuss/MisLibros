<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luis Fernando Carranza - Catálogo de Libros</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        header {
            text-align: center;
            padding: 2.5rem 1rem;
            background-color: #131921;
            color: white;
        }

        header p {
            color: #febd69;
        }

        /* Botones de Filtro */
        .filtros {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 2rem 0 1rem 0;
            flex-wrap: wrap;
            padding: 0 1rem;
        }

        .btn-filtro {
            background-color: #e3e6e8;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
        }

        .btn-filtro:hover, .btn-filtro.activo {
            background-color: #232f3e;
            color: white;
        }

        .grid-libros {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .tarjeta-libro {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tarjeta-libro img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            background-color: #eee;
        }

        .info-libro {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .categoria-tag {
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: bold;
            color: #007185;
            margin-bottom: 0.5rem;
        }

        .info-libro h3 {
            margin-top: 0;
            font-size: 1.15rem;
            text-transform: uppercase;
        }

        .info-libro h4 {
            margin: 0.5rem 0;
            font-size: 1rem;
            font-style: italic;
            color: #444;
            font-weight: normal;
        }

        .info-libro p {
            font-size: 0.9rem;
            color: #666;
            flex-grow: 1;
            line-height: 1.4;
        }

        .btn-amazon {
            display: inline-block;
            text-align: center;
            background-color: #ffd814;
            color: #0f1111;
            text-decoration: none;
            padding: 0.75rem;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #fcd200;
            transition: background 0.2s;
            margin-top: 1rem;
        }

        .btn-amazon:hover {
            background-color: #f7ca00;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #232f3e;
            color: white;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Luis Fernando Carranza</h1>
        <p>Catálogo oficial de obras publicadas en Amazon Kindle</p>
    </header>

    <!-- Botones de Filtrado -->
    <div class="filtros">
        <button class="btn-filtro activo" onclick="filtrarLibros('todos', this)">Todos</button>
        <button class="btn-filtro" onclick="filtrarLibros('Derecho', this)">Derecho</button>
        <button class="btn-filtro" onclick="filtrarLibros('Historia', this)">Historia</button>
        <button class="btn-filtro" onclick="filtrarLibros('Cuentos Cortos', this)">Cuentos Cortos</button>
    </div>

    <main>
        <div id="contenedor-libros" class="grid-libros">
            <!-- Los libros se cargarán dinámicamente aquí -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Luis Fernando Carranza - Todos los derechos reservados</p>
    </footer>

    <script>
        // Lista de libros
        const libros = [
            // DERECHO
            {
                titulo: "DERECHO ROMANO Y DERECHO ANGLOSAJÓN - DOS SISTEMAS, UN MUNDO JURÍDICO",
                subtitulo: "Los dos sistemas jurídicos que sentaron las bases para los sistemas judiciales actuales.",
                categoria: "Derecho",
                descripcion: "Este libro ofrece un recorrido comparativo por los dos grandes modelos jurídicos que han marcado la historia y configuración del Derecho moderno: el Derecho Romano y el Derecho Anglosajón (Common Law). A través de una estructura clara y rigurosa, se abordan sus orígenes históricos, fuentes normativas, principios fundamentales, instituciones clave, y su vigencia actual en el mundo globalizado.",
                portada: "LINK_DE_TU_IMAGEN_AQUI", 
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0F9N4LLZQ"
            },
            {
                titulo: "DERECHO ROMANO",
                subtitulo: "Evolución y legado para la modernidad",
                categoria: "Derecho",
                descripcion: "¿Alguna vez te has preguntado de dónde provienen los principios legales que rigen nuestra sociedad? ¿Te gustaría conocer el sistema jurídico que sentó las bases de la civilización occidental? Embárcate en un apasionante viaje a través del tiempo con este libro que te revelará los secretos del Derecho Romano, un legado milenario que sigue vigente en nuestros días.",
                portada: "LINK_DE_TU_IMAGEN_AQUI",
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0D9KSNS16"
            },
            {
                titulo: "INTRODUCCIÓN AL DERECHO INTERNACIONAL",
                subtitulo: "Desde los fundamentos hasta los retos contemporáneos",
                categoria: "Derecho",
                descripcion: "Obra fundamental para estudiantes, profesionales y apasionados por el mundo del derecho. En este libro, se exploran de manera clara y estructurada los pilares y la evolución del Derecho Internacional, brindando una comprensión profunda sobre sus principios esenciales y su relevancia en el contexto global actual.",
                portada: "LINK_DE_TU_IMAGEN_AQUI",
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0DM9QFHHB"
            },

            // HISTORIA (Basado en la categoría elegida implícita en los textos)
            {
                titulo: "LEGADO LA HISTORIA DEL MUNDO",
                subtitulo: "Un libro de 720 paginas con toda la historia de la humanidad desde el inicio de los tiempos hasta el siglo XXI",
                categoria: "Historia",
                descripcion: "Una historia del mundo, contada con claridad, amplitud y pasión. Desde la formación del universo hasta el auge de la inteligencia artificial, este libro propone un recorrido ágil y riguroso por los grandes momentos de la historia humana. Dividido en nueve partes temáticas y cronológicas, ofrece al lector una visión global de las civilizaciones, las ideas, los conflictos y los cambios que han marcado nuestro pasado colectivo.",
                portada: "LINK_DE_TU_IMAGEN_AQUI",
                enlaceAmazon: "https://www.amazon.com/dp/B0F9TPC3JL"
            },
            {
                titulo: "RASPUTÍN",
                subtitulo: "Mito, Poder y Caída del Último Imperio Ruso",
                categoria: "Historia",
                descripcion: "En el ocaso del Imperio ruso, un hombre de origen humilde se convirtió en la figura más temida y fascinante de la corte imperial. Grigori Rasputín, campesino siberiano, místico y sanador, entró en la vida del zar Nicolás II y la zarina Alexandra. Este libro recorre su vida desde la aldea donde nació hasta la noche de su asesinato, desmontando mitos y revelando la verdad detrás del hombre que, según muchos, aceleró la caída de la dinastía Romanov.",
                portada: "LINK_DE_TU_IMAGEN_AQUI",
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0FMKKXC4B"
            },
            {
                titulo: "EL MONSTRUO DE LOS ANDES",
                subtitulo: "Pedro Alonso López el asesino en serie más letal de América",
                categoria: "Historia",
                descripcion: "Crímenes que no deben olvidarse: El caso de Pedro Alonso López es una exploración rigurosa y respetuosa de uno de los episodios más oscuros de la historia criminal de América Latina. Este libro narra la vida y los crímenes del 'Monstruo de los Andes', un asesino en serie que confesó haber matado a más de 300 niñas en Colombia, Ecuador y Perú durante la década de 1970.",
                portada: "LINK_DE_TU_IMAGEN_AQUI",
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0FLRSNRNX"
            },

            // CUENTOS CORTOS
            {
                titulo: "EL HOMBRE CON CARA DE VACA",
                subtitulo: "",
                categoria: "Cuentos Cortos",
                descripcion: "En lo profundo del campo, donde la oscuridad se mezcla con la niebla, nace una leyenda que hiela la sangre: El Hombre con Cara de Vaca. Durante generaciones, los abuelos advirtieron a sus nietos sobre una criatura que se alimenta de animales y, a veces, de seres humanos. Nadie le presta atención a los cuentos antiguos, hasta que la noche se convierte en pesadilla.",
                portada: "LINK_DE_TU_IMAGEN_AQUI",
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0FSCKPJ2F"
            },
            {
                titulo: "EL TAPIZ FRACTURADO - CUENTO CORTO",
                subtitulo: "Viajes en el tiempo complejos",
                categoria: "Cuentos Cortos",
                descripcion: "En un futuro donde la ciencia ha tejido los límites del tiempo como si fueran hilos de un tapiz infinito, El Tapiz Fracturado nos sumerge en un viaje vertiginoso a través de múltiples realidades, decisiones imposibles y paradojas sin salida. Este cuento de ciencia ficción explora las consecuencias de intervenir en el pasado, no solo desde la física, sino desde lo humano.",
                portada: "LINK_DE_TU_IMAGEN_AQUI",
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0DS6HVB23"
            },
            {
                titulo: "EL ÚLTIMO REFUGIO",
                subtitulo: "",
                categoria: "Cuentos Cortos",
                descripcion: "En el año 2275, la Tierra se ha vuelto inhabitable tras un fallido experimento de geoingeniería. La humanidad sobrevive confinada en la imponente Ciudad Vertical, una megaestructura donde el privilegio se mide en pisos y la esperanza parece un mito del pasado. Unidos por el misterio del 'Proyecto Edén', un trío se lanza a descubrir una verdad que los celestes han ocultado.",
                portada: "LINK_DE_TU_IMAGEN_AQUI",
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0FBSTNTR3"
            },
            {
                titulo: "LA ÚLTIMA HORA DEL PRINCIPIO",
                subtitulo: "",
                categoria: "Cuentos Cortos",
                descripcion: "Atrapado en un laboratorio al borde del colapso, un científico viaja cuatro horas al pasado para evitar una catástrofe, solo para descubrir que ha entrado en un bucle infinito donde se enfrenta a su propio alter ego en un ciclo eterno de muerte y renacimiento.",
                portada: "LINK_DE_TU_IMAGEN_AQUI",
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0HFYK8M5X"
            }
        ];

        function mostrarLibros(librosAMostrar) {
            const contenedor = document.getElementById("contenedor-libros");
            contenedor.innerHTML = "";
            
            librosAMostrar.forEach(libro => {
                const tarjeta = document.createElement("div");
                tarjeta.classList.add("tarjeta-libro");
                
                // Si la portada es LINK_DE_TU_IMAGEN_AQUI, usamos el placeholder dinámico
                let portadaSrc = libro.portada === "LINK_DE_TU_IMAGEN_AQUI" 
                    ? `https://via.placeholder.com/300x450/131921/FFFFFF?text=${encodeURIComponent(libro.titulo)}`
                    : libro.portada;

                // Solo mostramos subtítulo si existe
                let subtituloHtml = libro.subtitulo ? `<h4>${libro.subtitulo}</h4>` : '';
                
                tarjeta.innerHTML = `
                    <img src="${portadaSrc}" alt="Portada de ${libro.titulo}" onerror="this.src='https://via.placeholder.com/300x450/131921/FFFFFF?text=${encodeURIComponent(libro.titulo)}'">
                    <div class="info-libro">
                        <span class="categoria-tag">${libro.categoria}</span>
                        <h3>${libro.titulo}</h3>
                        ${subtituloHtml}
                        <p>${libro.descripcion}</p>
                        <a href="${libro.enlaceAmazon}" target="_blank" class="btn-amazon">Ver en Amazon</a>
                    </div>
                `;
                
                contenedor.appendChild(tarjeta);
            });
        }

        function filtrarLibros(categoria, boton) {
            // Cambiar clase activa en los botones
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('activo'));
            boton.classList.add('activo');

            if (categoria === 'todos') {
                mostrarLibros(libros);
            } else {
                const filtrados = libros.filter(libro => libro.categoria === categoria);
                mostrarLibros(filtrados);
            }
        }

        // Cargar todos al iniciar la página
        document.addEventListener("DOMContentLoaded", () => {
            mostrarLibros(libros);
        });
    </script>
</body>
</html>
