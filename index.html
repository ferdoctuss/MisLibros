<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luis Fernando Carranza - Autor</title>
    <style>
        /* --- ESTILOS PRINCIPALES --- */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fafafa;
            color: #222;
        }

        header {
            text-align: center;
            padding: 5rem 1rem 3rem;
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
        }

        header h1 {
            font-family: 'Georgia', 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: normal;
            letter-spacing: 1px;
            margin: 0 0 0.5rem 0;
            color: #111;
        }

        header p {
            color: #666;
            font-size: 1.1rem;
            font-style: italic;
            margin: 0;
        }

        /* Botones de Filtro */
        .filtros {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 3rem 0 1rem 0;
            flex-wrap: wrap;
            padding: 0 1rem;
        }

        .btn-filtro {
            background-color: transparent;
            color: #555;
            border: 1px solid #ccc;
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-filtro:hover, .btn-filtro.activo {
            background-color: #111;
            color: #fff;
            border-color: #111;
        }

        /* Cuadrícula de libros (Solo Muestra Título y Portada) */
        .grid-libros {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 3.5rem 2rem; 
            max-width: 1200px;
            margin: 2rem auto 5rem;
            padding: 0 2rem;
            align-items: start;
        }

        .tarjeta-libro {
            display: flex;
            flex-direction: column;
            background: transparent;
            cursor: pointer; /* Cambia el cursor para indicar que es clickeable */
            transition: transform 0.2s ease;
        }

        .tarjeta-libro:hover {
            transform: scale(1.02); /* Pequeño efecto de zoom al pasar el ratón */
        }

        .tarjeta-libro img {
            width: 100%;
            height: auto;
            aspect-ratio: 2 / 3;
            object-fit: contain; 
            border-radius: 2px 5px 5px 2px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.15);
            margin-bottom: 1.5rem;
            background-color: transparent;
        }

        .info-libro {
            display: flex;
            flex-direction: column;
        }

        .categoria-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .info-libro h3 {
            font-family: 'Georgia', 'Playfair Display', serif;
            margin: 0;
            font-size: 1.15rem;
            line-height: 1.3;
            color: #111;
        }

        .info-libro h4 {
            margin: 0.4rem 0 0;
            font-size: 0.9rem;
            font-style: italic;
            color: #555;
            font-weight: normal;
        }

        /* --- VENTANA MODAL (SUB-PÁGINA) --- */
        .modal {
            display: none; /* Oculto por defecto */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7); /* Fondo oscuro semitransparente */
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: #fff;
            margin: auto;
            padding: 0;
            border-radius: 8px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            animation: deslizarArriba 0.3s ease-out;
        }

        @keyframes deslizarArriba {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .cerrar-btn {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 2rem;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            z-index: 10;
        }

        .cerrar-btn:hover {
            color: #111;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            padding: 3rem;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .modal-body {
                flex-direction: row;
            }
        }

        .modal-portada {
            flex: 0 0 35%;
            max-width: 300px;
            margin: 0 auto;
        }

        .modal-portada img {
            width: 100%;
            border-radius: 2px 5px 5px 2px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
        }

        .modal-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .modal-info h2 {
            font-family: 'Georgia', 'Playfair Display', serif;
            font-size: 2rem;
            margin: 0 0 0.5rem 0;
            color: #111;
        }

        .modal-info h4 {
            font-size: 1.1rem;
            font-style: italic;
            color: #555;
            margin: 0 0 1.5rem 0;
            font-weight: normal;
        }

        .modal-info p {
            font-size: 1rem;
            line-height: 1.7;
            color: #444;
            margin-bottom: 2rem;
        }

        .btn-amazon {
            align-self: flex-start;
            background-color: #111;
            color: #fff;
            text-decoration: none;
            padding: 0.8rem 1.8rem;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
            border: 1px solid #111;
        }

        .btn-amazon:hover {
            background-color: #fff;
            color: #111;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background-color: #ffffff;
            color: #888;
            border-top: 1px solid #eaeaea;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Luis Fernando Carranza</h1>
        <p>Catálogo oficial de obras literarias y académicas</p>
    </header>

    <div class="filtros">
        <button class="btn-filtro activo" onclick="filtrarLibros('todos', this)">Colección Completa</button>
        <button class="btn-filtro" onclick="filtrarLibros('Derecho', this)">Derecho</button>
        <button class="btn-filtro" onclick="filtrarLibros('Historia', this)">Historia</button>
        <button class="btn-filtro" onclick="filtrarLibros('Cuentos Cortos', this)">Ficción y Cuentos</button>
    </div>

    <main>
        <div id="contenedor-libros" class="grid-libros">
            <!-- Los libros se cargarán dinámicamente aquí -->
        </div>
    </main>

    <!-- Estructura de la Ventana Modal -->
    <div id="modal-libro" class="modal">
        <div class="modal-content">
            <span class="cerrar-btn" onclick="cerrarModal()">&times;</span>
            <div id="modal-cuerpo" class="modal-body">
                <!-- El contenido se inyecta por JavaScript -->
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Luis Fernando Carranza - Todos los derechos reservados.</p>
    </footer>

    <script>
        // Lista completa de tus libros
        const libros = [
            // DERECHO

                portada: "https://m.media-amazon.com/images/I/81i3eMECfHL._SL1500_.jpg", 
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0F9N4LLZQ"
            },
            {
                titulo: "DERECHO ROMANO",
                subtitulo: "Evolución y legado para la modernidad",
                categoria: "Derecho",

                portada: "https://m.media-amazon.com/images/I/91e8IPYdMiL._SL1500_.jpg",
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0D9KSNS16"
            },
            {
                titulo: "INTRODUCCIÓN AL DERECHO INTERNACIONAL",
                subtitulo: "Desde los fundamentos hasta los retos contemporáneos",
                categoria: "Derecho",
                descripcion: "Obra fundamental para estudiantes, profesionales y apasionados por el mundo del derecho. En este libro, se exploran de manera clara y estructurada los pilares y la evolución del Derecho Internacional, brindando una comprensión profunda sobre sus principios esenciales y su relevancia en el contexto global actual.",
                portada: "https://m.media-amazon.com/images/I/61BCTMcwzLL._SL1500_.jpg",
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0DM9QFHHB"
            },

            // HISTORIA
            {
                titulo: "LEGADO LA HISTORIA DEL MUNDO",
                subtitulo: "Toda la historia de la humanidad desde el inicio de los tiempos hasta el siglo XXI",
                categoria: "Historia",
                descripcion: "Una historia del mundo, contada con claridad, amplitud y pasión. Desde la formación del universo hasta el auge de la inteligencia artificial, este libro propone un recorrido ágil y riguroso por los grandes momentos de la historia humana. Dividido en nueve partes temáticas y cronológicas, ofrece al lector una visión global de las civilizaciones, las ideas, los conflictos y los cambios que han marcado nuestro pasado colectivo.",
                portada: "https://m.media-amazon.com/images/I/71qAzgZ1kyL._SL1500_.jpg",

            },
            {
                titulo: "RASPUTÍN",
                subtitulo: "Mito, Poder y Caída del Último Imperio Ruso",
                categoria: "Historia",
                descripcion: "En el ocaso del Imperio ruso, un hombre de origen humilde se convirtió en la figura más temida y fascinante de la corte imperial. Grigori Rasputín, campesino siberiano, místico y sanador, entró en la vida del zar Nicolás II y la zarina Alexandra. Este libro recorre su vida desde la aldea donde nació hasta la noche de su asesinato, desmontando mitos y revelando la verdad detrás del hombre que, según muchos, aceleró la caída de la dinastía Romanov.",
                portada: "https://m.media-amazon.com/images/I/616+TDNgIPL._SL1500_.jpg",
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0FMKKXC4B"
            },
            {
                titulo: "EL MONSTRUO DE LOS ANDES",
                subtitulo: "Pedro Alonso López el asesino en serie más letal de América",
                categoria: "Historia",
                descripcion: "Crímenes que no deben olvidarse: El caso de Pedro Alonso López es una exploración rigurosa y respetuosa de uno de los episodios más oscuros de la historia criminal de América Latina. Este libro narra la vida y los crímenes del 'Monstruo de los Andes', un asesino en serie que confesó haber matado a más de 300 niñas en Colombia, Ecuador y Perú durante la década de 1970.",

                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0FLRSNRNX"
            },

            // CUENTOS CORTOS
            {
                titulo: "EL HOMBRE CON CARA DE VACA",
                subtitulo: "",

            },
            {
                titulo: "EL TAPIZ FRACTURADO",
                subtitulo: "Cuento Corto: Viajes en el tiempo complejos",
                categoria: "Cuentos Cortos",
                descripcion: "En un futuro donde la ciencia ha tejido los límites del tiempo como si fueran hilos de un tapiz infinito, El Tapiz Fracturado nos sumerge en un viaje vertiginoso a través de múltiples realidades, decisiones imposibles y paradojas sin salida. Este cuento de ciencia ficción explora las consecuencias de intervenir en el pasado, no solo desde la física, sino desde lo humano.",
                portada: "https://m.media-amazon.com/images/I/81711uPpcjL._SL1500_.jpg",

            },
            {
                titulo: "EL ÚLTIMO REFUGIO",
                subtitulo: "",
                categoria: "Cuentos Cortos",
                descripcion: "En el año 2275, la Tierra se ha vuelto inhabitable tras un fallido experimento de geoingeniería. La humanidad sobrevive confinada en la imponente Ciudad Vertical, una megaestructura donde el privilegio se mide en pisos y la esperanza parece un mito del pasado. Unidos por el misterio del 'Proyecto Edén', un trío se lanza a descubrir una verdad que los celestes han ocultado.",
                portada: "https://m.media-amazon.com/images/I/61sj2dIuH-L._SL1500_.jpg",
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0FBSTNTR3"
            },
            {
                titulo: "LA ÚLTIMA HORA DEL PRINCIPIO",
                subtitulo: "",
                categoria: "Cuentos Cortos",
                descripcion: "Atrapado en un laboratorio al borde del colapso, un científico viaja cuatro horas al pasado para evitar una catástrofe, solo para descubrir que ha entrado en un bucle infinito donde se enfrenta a su propio alter ego en un ciclo eterno de muerte y renacimiento.",
                portada: "https://m.media-amazon.com/images/I/71nhbSrV8VL._SL1500_.jpg",
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0HFYK8M5X"
            }
        ];

        function mostrarLibros(librosAMostrar) {
            const contenedor = document.getElementById("contenedor-libros");
            contenedor.innerHTML = "";
            
            librosAMostrar.forEach((libro, index) => {
                const tarjeta = document.createElement("div");
                tarjeta.classList.add("tarjeta-libro");
                // Al hacer clic, enviamos el objeto del libro a la función abrirModal
                tarjeta.onclick = () => abrirModal(libro);
                
                let subtituloHtml = libro.subtitulo ? `<h4>${libro.subtitulo}</h4>` : '';
                
                // Muestra SOLO Portada, Categoría, Título y Subtítulo en la cuadrícula
                tarjeta.innerHTML = `
                    <img src="${libro.portada}" alt="Portada de ${libro.titulo}">
                    <div class="info-libro">
                        <span class="categoria-tag">${libro.categoria}</span>
                        <h3>${libro.titulo}</h3>
                        ${subtituloHtml}
                    </div>
                `;
                
                contenedor.appendChild(tarjeta);
            });
        }

        // --- FUNCIONES DE LA VENTANA MODAL ---
        const modal = document.getElementById("modal-libro");
        const modalCuerpo = document.getElementById("modal-cuerpo");

        function abrirModal(libro) {
            let subtituloHtml = libro.subtitulo ? `<h4>${libro.subtitulo}</h4>` : '';
            
            modalCuerpo.innerHTML = `
                <div class="modal-portada">
                    <img src="${libro.portada}" alt="Portada de ${libro.titulo}">
                </div>
                <div class="modal-info">
                    <span class="categoria-tag">${libro.categoria}</span>
                    <h2>${libro.titulo}</h2>
                    ${subtituloHtml}
                    <p>${libro.descripcion}</p>
                    <a href="${libro.enlaceAmazon}" target="_blank" class="btn-amazon">Ver en Amazon</a>
                </div>
            `;
            modal.style.display = "flex"; // Muestra el modal
            document.body.style.overflow = "hidden"; // Evita que el fondo haga scroll
        }

        function cerrarModal() {
            modal.style.display = "none";
            document.body.style.overflow = "auto"; // Reactiva el scroll del fondo
        }

        // Cierra el modal si el usuario hace clic fuera de la caja blanca
        window.onclick = function(event) {
            if (event.target == modal) {
                cerrarModal();
            }
        }

        // --- FILTROS ---
        function filtrarLibros(categoria, boton) {
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('activo'));
            boton.classList.add('activo');

            if (categoria === 'todos') {
                mostrarLibros(libros);
            } else {
                const filtrados = libros.filter(libro => libro.categoria === categoria);
                mostrarLibros(filtrados);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            mostrarLibros(libros);
        });
    </script>
</body>
</html>
