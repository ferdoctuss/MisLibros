<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luis Fernando Carranza - Autor</title>
    <style>
        /* --- ESTILOS REDISEÑADOS: PORTAFOLIO DE AUTOR --- */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fafafa; /* Fondo más limpio y claro */
            color: #222;
        }

        /* Cabecera minimalista y elegante */
        header {
            text-align: center;
            padding: 5rem 1rem 3rem;
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
        }

        header h1 {
            font-family: 'Georgia', 'Playfair Display', serif; /* Fuente literaria */
            font-size: 2.8rem;
            font-weight: normal;
            letter-spacing: 1px;
            margin: 0 0 0.5rem 0;
            color: #111;
        }

        header p {
            color: #666;
            font-size: 1.1rem;
            font-style: italic;
            margin: 0;
        }

        /* Botones de Filtro - Estilo sofisticado */
        .filtros {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 3rem 0 1rem 0;
            flex-wrap: wrap;
            padding: 0 1rem;
        }

        .btn-filtro {
            background-color: transparent;
            color: #555;
            border: 1px solid #ccc;
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-filtro:hover, .btn-filtro.activo {
            background-color: #111;
            color: #fff;
            border-color: #111;
        }

        /* Cuadrícula de libros: Más pequeña y con más espacio */
        .grid-libros {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); /* Libros más pequeños */
            gap: 3.5rem 2rem; 
            max-width: 1200px;
            margin: 2rem auto 5rem;
            padding: 0 2rem;
            align-items: start;
        }

        /* Tarjeta del libro invisible, la portada es la protagonista */
        .tarjeta-libro {
            display: flex;
            flex-direction: column;
            background: transparent;
        }

        /* Diseño de la portada realista */
        .tarjeta-libro img {
            width: 100%;
            height: auto;
            aspect-ratio: 2 / 3;
            object-fit: contain; 
            border-radius: 2px 5px 5px 2px; /* Simula el lomo y el borde de un libro */
            box-shadow: 5px 5px 15px rgba(0,0,0,0.15); /* Sombra de libro físico */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 1.5rem;
            background-color: transparent;
        }

        .tarjeta-libro img:hover {
            transform: translateY(-8px); /* Se eleva suavemente al pasar el ratón */
            box-shadow: 8px 12px 20px rgba(0,0,0,0.2);
        }

        .info-libro {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .categoria-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .info-libro h3 {
            font-family: 'Georgia', 'Playfair Display', serif;
            margin: 0;
            font-size: 1.15rem;
            line-height: 1.3;
            color: #111;
        }

        .info-libro h4 {
            margin: 0.4rem 0 0.8rem;
            font-size: 0.9rem;
            font-style: italic;
            color: #555;
            font-weight: normal;
        }

        /* Limitar descripción para mantener altura uniforme */
        .info-libro p {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.6;
            margin: 0 0 1.5rem 0;
            display: -webkit-box;
            -webkit-line-clamp: 3; /* Muestra solo 3 líneas */
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        /* Botón de compra minimalista */
        .btn-amazon {
            align-self: flex-start;
            background-color: #111;
            color: #fff;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 3px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
            border: 1px solid #111;
        }

        .btn-amazon:hover {
            background-color: #fff;
            color: #111;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background-color: #ffffff;
            color: #888;
            border-top: 1px solid #eaeaea;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Luis Fernando Carranza</h1>
        <p>Catálogo oficial de obras literarias y académicas</p>
    </header>

    <!-- Botones de Filtrado -->
    <div class="filtros">
        <button class="btn-filtro activo" onclick="filtrarLibros('todos', this)">Colección Completa</button>
        <button class="btn-filtro" onclick="filtrarLibros('Derecho', this)">Derecho</button>
        <button class="btn-filtro" onclick="filtrarLibros('Historia', this)">Historia</button>
        <button class="btn-filtro" onclick="filtrarLibros('Cuentos Cortos', this)">Ficción y Cuentos</button>
    </div>

    <main>
        <div id="contenedor-libros" class="grid-libros">
            <!-- Los libros se cargarán dinámicamente aquí -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Luis Fernando Carranza - Todos los derechos reservados.</p>
    </footer>

    <script>

                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0D9KSNS16"
            },
            {

                descripcion: "Obra fundamental para estudiantes, profesionales y apasionados por el mundo del derecho. En este libro, se exploran de manera clara y estructurada los pilares y la evolución del Derecho Internacional, brindando una comprensión profunda sobre sus principios esenciales y su relevancia en el contexto global actual.",
                portada: "https://m.media-amazon.com/images/I/61BCTMcwzLL._SL1500_.jpg",
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0DM9QFHHB"
            },

            // HISTORIA
            {
                titulo: "LEGADO LA HISTORIA DEL MUNDO",
                subtitulo: "Toda la historia de la humanidad desde el inicio de los tiempos hasta el siglo XXI",
                categoria: "Historia",
                descripcion: "Una historia del mundo, contada con claridad, amplitud y pasión. Desde la formación del universo hasta el auge de la inteligencia artificial, este libro propone un recorrido ágil y riguroso por los grandes momentos de la historia humana. Dividido en nueve partes temáticas y cronológicas, ofrece al lector una visión global de las civilizaciones, las ideas, los conflictos y los cambios que han marcado nuestro pasado colectivo.",

                portada: "https://m.media-amazon.com/images/I/61sj2dIuH-L._SL1500_.jpg",

            },
            {
                titulo: "LA ÚLTIMA HORA DEL PRINCIPIO",
                subtitulo: "",
                categoria: "Cuentos Cortos",
                descripcion: "Atrapado en un laboratorio al borde del colapso, un científico viaja cuatro horas al pasado para evitar una catástrofe, solo para descubrir que ha entrado en un bucle infinito donde se enfrenta a su propio alter ego en un ciclo eterno de muerte y renacimiento.",
                portada: "https://m.media-amazon.com/images/I/71nhbSrV8VL._SL1500_.jpg",
                enlaceAmazon: "https://www.amazon.com/Fernando-Carranza-ebook/dp/B0HFYK8M5X"
            }
        ];

        function mostrarLibros(librosAMostrar) {
            const contenedor = document.getElementById("contenedor-libros");
            contenedor.innerHTML = "";
            
            librosAMostrar.forEach(libro => {
                const tarjeta = document.createElement("div");
                tarjeta.classList.add("tarjeta-libro");
                
                let portadaSrc = libro.portada === "LINK_DE_TU_IMAGEN_AQUI" 
                    ? `https://via.placeholder.com/300x450/eeeeee/333333?text=${encodeURIComponent(libro.titulo)}`
                    : libro.portada;

                let subtituloHtml = libro.subtitulo ? `<h4>${libro.subtitulo}</h4>` : '';
                
                tarjeta.innerHTML = `
                    <img src="${portadaSrc}" alt="Portada de ${libro.titulo}" onerror="this.src='https://via.placeholder.com/300x450/eeeeee/333333?text=${encodeURIComponent(libro.titulo)}'">
                    <div class="info-libro">
                        <span class="categoria-tag">${libro.categoria}</span>
                        <h3>${libro.titulo}</h3>
                        ${subtituloHtml}
                        <p>${libro.descripcion}</p>
                        <a href="${libro.enlaceAmazon}" target="_blank" class="btn-amazon">Ver en Amazon</a>
                    </div>
                `;
                
                contenedor.appendChild(tarjeta);
            });
        }

        function filtrarLibros(categoria, boton) {
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('activo'));
            boton.classList.add('activo');

            if (categoria === 'todos') {
                mostrarLibros(libros);
            } else {
                const filtrados = libros.filter(libro => libro.categoria === categoria);
                mostrarLibros(filtrados);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            mostrarLibros(libros);
        });
    </script>
</body>
</html>
