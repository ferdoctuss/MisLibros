    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        header {
            text-align: center;
            padding: 2.5rem 1rem;
            background-color: #131921;
            color: white;
        }

        header p {
            color: #febd69;
        }

        /* Botones de Filtro */
        .filtros {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 2rem 0 1rem 0;
            flex-wrap: wrap;
            padding: 0 1rem;
        }

        .btn-filtro {
            background-color: #e3e6e8;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
        }

        .btn-filtro:hover, .btn-filtro.activo {
            background-color: #232f3e;
            color: white;
        }

        .grid-libros {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .tarjeta-libro {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tarjeta-libro img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            background-color: #eee;
        }

        .info-libro {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .categoria-tag {
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: bold;
            color: #007185;
            margin-bottom: 0.5rem;
        }

        .info-libro h3 {
            margin-top: 0;
            font-size: 1.15rem;
        }

        .info-libro p {
            font-size: 0.9rem;
            color: #666;
            flex-grow: 1;
        }

        .btn-amazon {
            display: inline-block;
            text-align: center;
            background-color: #ffd814;
            color: #0f1111;
            text-decoration: none;
            padding: 0.75rem;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #fcd200;
            transition: background 0.2s;
            margin-top: 1rem;
        }

        .btn-amazon:hover {
            background-color: #f7ca00;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #232f3e;
            color: white;
            margin-top: 3rem;
        }
    </style>
</head>

        function mostrarLibros(librosAMostrar) {
            const contenedor = document.getElementById("contenedor-libros");
            contenedor.innerHTML = "";
            
            librosAMostrar.forEach(libro => {
                const tarjeta = document.createElement("div");
                tarjeta.classList.add("tarjeta-libro");
                
                tarjeta.innerHTML = `
                    <img src="${libro.portada}" alt="Portada de ${libro.titulo}" onerror="this.src='https://via.placeholder.com/300x450.png?text=Libro+Amazon'">
                    <div class="info-libro">
                        <span class="categoria-tag">${libro.categoria}</span>
                        <h3>${libro.titulo}</h3>
                        <p>${libro.descripcion}</p>
                        <a href="${libro.enlaceAmazon}" target="_blank" class="btn-amazon">Ver en Amazon</a>
                    </div>
                `;
                
                contenedor.appendChild(tarjeta);
            });
        }

        function filtrarLibros(categoria, boton) {
            // Cambiar clase activa en los botones
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('activo'));
            boton.classList.add('activo');

            if (categoria === 'todos') {
                mostrarLibros(libros);
            } else {
                const filtrados = libros.filter(libro => libro.categoria === categoria);
                mostrarLibros(filtrados);
            }
        }

        // Cargar todos al iniciar la página
        document.addEventListener("DOMContentLoaded", () => {
            mostrarLibros(libros);
        });
